<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>bitflip · wargames</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;700&family=Oxanium:wght@600;700;800&display=swap" rel="stylesheet">
<style>

/* ── RESET ─────────────────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
a { text-decoration: none; color: inherit; }
ul { list-style: none; }
button { background: none; border: none; cursor: pointer; font: inherit; }

/* ── VARIABLES ──────────────────────────────────────────── */
:root {
  --c-bg:        #0a0a0a;
  --c-sidebar:   #0d0d0d;
  --c-surface:   #111111;
  --c-border:    #1e1e1e;
  --c-border-2:  #2a2a2a;
  --c-text:      #b0b0b0;
  --c-heading:   #e8e8e8;
  --c-muted:     #484848;
  --c-accent:    #3b9eff;
  --c-accent-dim:#3b9eff1a;
  --c-dim:       #222;
  --font-mono:   'JetBrains Mono', monospace;
  --font-display:'Oxanium', sans-serif;
  --sidebar-w:   240px;
  --transition:  0.18s ease;
}

/* ── BASE ───────────────────────────────────────────────── */
body {
  font-family: var(--font-mono);
  background: var(--c-bg);
  color: var(--c-text);
  font-size: 13px;
  line-height: 1.75;
  min-height: 100vh;
  overflow-x: hidden;
}

body::after {
  content: '';
  position: fixed; inset: 0; pointer-events: none; z-index: 9999;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
  opacity: 0.035;
}

::-webkit-scrollbar { width: 4px; }
::-webkit-scrollbar-track { background: var(--c-bg); }
::-webkit-scrollbar-thumb { background: var(--c-border-2); border-radius: 2px; }
::-webkit-scrollbar-thumb:hover { background: var(--c-muted); }

/* ── LAYOUT ─────────────────────────────────────────────── */
.app { display: flex; min-height: 100vh; }

/* ── SIDEBAR ────────────────────────────────────────────── */
.sidebar {
  position: fixed;
  top: 0; left: 0; bottom: 0;
  width: var(--sidebar-w);
  background: var(--c-sidebar);
  border-right: 1px solid var(--c-border);
  display: flex;
  flex-direction: column;
  overflow-y: auto;
  z-index: 100;
}

.sidebar-logo {
  padding: 32px 24px 28px;
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
}

.logo-name {
  font-family: var(--font-display);
  font-size: 24px;
  font-weight: 800;
  color: var(--c-heading);
  letter-spacing: -0.03em;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 12px;
}

.logo-name .bit { color: var(--c-heading); }
.logo-name .flip { color: var(--c-accent); position: relative; }

.logo-icon {
  width: 20px;
  height: 20px;
  border: 2px solid var(--c-accent);
  border-radius: 4px;
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
  overflow: hidden;
  flex-shrink: 0;
}

.logo-icon::after {
  content: '1';
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--c-accent);
  font-weight: 700;
  transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
}

.sidebar-logo:hover .logo-icon::after {
  transform: translateY(-22px);
}

.logo-icon::before {
  content: '0';
  position: absolute;
  top: 22px;
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--c-accent);
  font-weight: 700;
  transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
}

.sidebar-logo:hover .logo-icon::before {
  transform: translateY(-22px);
}

.logo-tagline {
  font-size: 10px;
  color: var(--c-muted);
  margin-top: 6px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
}

.sidebar-nav { flex: 1; padding: 16px 0; }

.nav-section-label {
  font-size: 9px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--c-muted);
  padding: 8px 24px 6px;
}

.nav-item {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px 24px;
  color: var(--c-text);
  font-size: 13.5px;
  cursor: pointer;
  transition: color var(--transition);
}

.nav-item:hover {
  color: var(--c-heading);
}

.nav-item.active {
  color: var(--c-accent);
  font-weight: 500;
}

.nav-arrow {
  margin-left: auto;
  font-size: 14px;
  opacity: 0.4;
  transition: transform 0.22s ease, opacity 0.18s ease;
  padding: 4px 6px;
  border-radius: 3px;
}

.nav-arrow:hover {
  opacity: 0.8;
  background: rgba(255,255,255,0.06);
}

.nav-levels {
  overflow: hidden;
  max-height: 0;
  transition: max-height 0.3s ease;
}

.nav-levels.open { max-height: 1200px; }

.nav-level-item {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 5px 24px 5px 36px;
  color: var(--c-muted);
  font-size: 12px;
  cursor: pointer;
  transition: color var(--transition);
}

.nav-level-item:hover { color: var(--c-text); }
.nav-level-item.active { color: var(--c-accent); font-weight: 500; }

.nav-level-dot {
  width: 3px; height: 3px;
  border-radius: 50%;
  background: currentColor;
  flex-shrink: 0;
  opacity: 0.4;
}

.nav-level-item.active .nav-level-dot { opacity: 0; width: 0; }

.nav-divider {
  height: 1px;
  background: var(--c-border);
  margin: 12px 24px;
}


/* ── CONTENT AREA ───────────────────────────────────────── */
.content {
  margin-left: var(--sidebar-w);
  flex: 1;
  min-height: 100vh;
  padding: 52px 48px 52px 64px;
}

/* ── PAGE TRANSITIONS ───────────────────────────────────── */
@keyframes fadeIn {
  from { opacity: 0; transform: translateY(10px); }
  to   { opacity: 1; transform: translateY(0); }
}

.page { animation: fadeIn 0.22s ease both; }

/* ── TYPOGRAPHY ─────────────────────────────────────────── */
.page-title {
  font-family: var(--font-display);
  font-size: clamp(22px, 3vw, 30px);
  font-weight: 800;
  color: var(--c-heading);
  letter-spacing: -0.02em;
  margin-bottom: 6px;
}

.page-subtitle {
  font-size: 12px;
  color: var(--c-muted);
  margin-bottom: 40px;
  letter-spacing: 0.04em;
}

h2 {
  font-family: var(--font-mono);
  font-size: 11px;
  font-weight: 500;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--c-accent);
  margin-bottom: 12px;
  margin-top: 36px;
  display: flex;
  align-items: center;
  gap: 10px;
}

h2::after {
  content: '';
  flex: 1;
  height: 1px;
  background: var(--c-border);
}

p { color: var(--c-text); line-height: 1.8; margin-bottom: 12px; }

/* ── CODE / COMMAND BLOCKS ──────────────────────────────── */
.cmd-block {
  background: var(--c-surface);
  border: 1px solid var(--c-border);
  border-left: 2px solid var(--c-accent);
  border-radius: 4px;
  padding: 14px 20px;
  padding-right: 52px;
  margin: 12px 0;
  font-family: var(--font-mono);
  font-size: 12.5px;
  color: var(--c-heading);
  line-height: 1.7;
  overflow-x: auto;
  position: relative;
  cursor: pointer;
  transition: border-color var(--transition);
}

.cmd-block:hover {
  border-color: var(--c-accent);
}

.cmd-copy-btn {
  position: absolute;
  top: 50%;
  right: 12px;
  transform: translateY(-50%);
  font-family: var(--font-mono);
  font-size: 9px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--c-muted);
  background: var(--c-bg);
  border: 1px solid var(--c-border);
  border-radius: 3px;
  padding: 3px 7px;
  cursor: pointer;
  transition: color var(--transition), border-color var(--transition);
  user-select: none;
  white-space: nowrap;
}

.cmd-block:hover .cmd-copy-btn {
  color: var(--c-accent);
  border-color: var(--c-accent);
}

.cmd-copy-btn.copied {
  color: var(--c-accent);
  border-color: var(--c-accent);
}

.cmd-block .prompt { color: var(--c-accent); user-select: none; }
.cmd-block .flag   { color: #82b1ff; }
.cmd-block .ip     { color: #ffd740; }
.cmd-block .host   { color: #ff6e6e; }

code {
  font-family: var(--font-mono);
  font-size: 12px;
  background: var(--c-surface);
  border: 1px solid var(--c-border);
  padding: 1px 6px;
  border-radius: 3px;
  color: var(--c-heading);
}

/* ── INFO BOX ───────────────────────────────────────────── */
.info-box {
  background: var(--c-surface);
  border: 1px solid var(--c-border-2);
  border-radius: 6px;
  padding: 20px 24px;
  margin: 12px 0 24px;
}

.info-box-title {
  font-size: 9px;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--c-muted);
  margin-bottom: 12px;
}

.info-row {
  display: flex;
  gap: 16px;
  padding: 5px 0;
  border-bottom: 1px solid var(--c-border);
  font-size: 12.5px;
}

.info-row:last-child { border-bottom: none; }

.info-label {
  color: var(--c-muted);
  min-width: 80px;
  flex-shrink: 0;
  font-size: 11px;
}

.info-value { color: var(--c-heading); font-family: var(--font-mono); }
.info-value.accent { color: var(--c-accent); }

/* ── COLLAPSIBLE ────────────────────────────────────────── */
.collapsible {
  border: 1px solid var(--c-border);
  border-radius: 5px;
  margin: 8px 0 20px;
  overflow: hidden;
}

.collapsible-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 12px 18px;
  cursor: pointer;
  background: var(--c-surface);
  user-select: none;
  transition: background var(--transition);
  gap: 12px;
}

.collapsible-header:hover {
  background: rgba(255,255,255,0.03);
}

.collapsible-label {
  font-size: 10px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--c-muted);
  font-weight: 500;
  display: flex;
  align-items: center;
  gap: 10px;
}

.collapsible-label::before {
  content: '';
  display: inline-block;
  width: 6px; height: 6px;
  border-radius: 50%;
  background: var(--c-accent);
  flex-shrink: 0;
}

.collapsible-toggle {
  font-size: 11px;
  color: var(--c-muted);
  font-family: var(--font-mono);
  flex-shrink: 0;
  transition: color var(--transition), transform var(--transition);
  display: flex;
  align-items: center;
  gap: 6px;
}

.collapsible-toggle .chevron {
  display: inline-block;
  transition: transform 0.22s ease;
  opacity: 0.5;
  font-size: 14px;
  line-height: 1;
}

.collapsible.open .collapsible-toggle .chevron {
  transform: rotate(90deg);
  opacity: 1;
  color: var(--c-accent);
}

.collapsible-toggle .toggle-text {
  font-size: 10px;
  letter-spacing: 0.08em;
}

.collapsible.open .collapsible-toggle .toggle-text {
  color: var(--c-accent);
}

.collapsible-body {
  height: 0;
  overflow: hidden;
  transition: height 0.28s cubic-bezier(0.4, 0, 0.2, 1);
}

.collapsible.open .collapsible-body {
  /* height set by JS */
}

.collapsible-inner {
  padding: 20px 20px 16px;
  border-top: 1px solid var(--c-border);
}

/* hint collapsible has a subtle left accent */
.collapsible.hint-collapsible {
  border-left: 2px solid rgba(59,158,255,0.3);
}

.collapsible.info-collapsible {
  border-left: 2px solid rgba(130,177,255,0.2);
}

.collapsible.info-collapsible .collapsible-label::before {
  background: #82b1ff;
}

/* ── WARGAME CARD ───────────────────────────────────────── */
.wargame-card {
  border: 1px solid var(--c-border-2);
  border-radius: 6px;
  padding: 28px 32px;
  margin: 24px 0;
  background: var(--c-surface);
  cursor: pointer;
  transition: border-color var(--transition), transform var(--transition), box-shadow var(--transition);
  position: relative;
  overflow: hidden;
}

.wargame-card::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 1px;
  background: linear-gradient(90deg, var(--c-accent), transparent);
  opacity: 0;
  transition: opacity var(--transition);
}

.wargame-card:hover {
  transform: translateY(-2px);
  box-shadow: 0 8px 32px rgba(0,0,0,0.4);
}

.wargame-card:hover::before { opacity: 1; }

.wargame-card-title {
  font-family: var(--font-display);
  font-size: 20px;
  font-weight: 700;
  color: var(--c-heading);
  margin-bottom: 8px;
  letter-spacing: -0.02em;
}

.wargame-card-desc {
  color: var(--c-text);
  font-size: 12.5px;
  line-height: 1.8;
  margin-bottom: 20px;
}

.wargame-card-meta {
  display: flex;
  gap: 24px;
  font-size: 11px;
  color: var(--c-muted);
}

.wargame-card-meta span { display: flex; align-items: center; gap: 6px; }

.badge {
  display: inline-flex;
  align-items: center;
  padding: 2px 8px;
  background: var(--c-accent-dim);
  color: var(--c-accent);
  border: 1px solid rgba(59,158,255,0.25);
  border-radius: 3px;
  font-size: 10px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
}

.btn {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 9px 18px;
  border: 1px solid var(--c-accent);
  color: var(--c-accent);
  border-radius: 4px;
  font-family: var(--font-mono);
  font-size: 12px;
  cursor: pointer;
  transition: background var(--transition), color var(--transition);
  margin-top: 4px;
}

.btn:hover { background: var(--c-accent); color: #000; }

/* ── LEVEL NAVIGATION ───────────────────────────────────── */
.level-nav {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-top: 52px;
  padding-top: 24px;
  border-top: 1px solid var(--c-border);
}

.level-nav-btn {
  font-family: var(--font-mono);
  font-size: 12px;
  color: var(--c-muted);
  cursor: pointer;
  transition: color var(--transition);
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 6px 0;
}

.level-nav-btn:hover { color: var(--c-accent); }
.level-nav-btn.disabled { opacity: 0.3; pointer-events: none; }

/* ── LEVEL TABLE ────────────────────────────────────────── */
.level-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 12px;
  margin: 16px 0;
}

.level-table th {
  text-align: left;
  font-size: 9px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--c-muted);
  padding: 8px 12px;
  border-bottom: 1px solid var(--c-border);
  font-weight: 400;
}

.level-table td {
  padding: 10px 12px;
  border-bottom: 1px solid var(--c-border);
  color: var(--c-text);
  vertical-align: top;
}

.level-table tr:hover td { background: rgba(255,255,255,0.015); }

.level-table .level-link {
  color: var(--c-accent);
  cursor: pointer;
}

.level-table .level-link:hover { text-decoration: underline; }
.level-table .flag-cell { color: #82b1ff; font-size: 11.5px; }
.tbd-row td { opacity: 0.35; }

/* ── RULES LIST ─────────────────────────────────────────── */
.rules-list { list-style: none; margin: 12px 0; }

.rules-list li {
  padding: 10px 0;
  border-bottom: 1px solid var(--c-border);
  display: flex;
  gap: 14px;
  font-size: 12.5px;
  color: var(--c-text);
}

.rules-list li::before {
  content: '/';
  color: var(--c-accent);
  flex-shrink: 0;
  opacity: 0.6;
}

/* ── LANGUAGE TOGGLE ───────────────────────────────────── */
.lang-btn {
  font-family: var(--font-mono);
  font-size: 10px;
  color: var(--c-muted);
  border: 1px solid var(--c-border);
  padding: 2px 6px;
  border-radius: 3px;
  transition: all var(--transition);
}

.lang-btn:hover { color: var(--c-text); border-color: var(--c-muted); }
.lang-btn.active { color: var(--c-accent); border-color: var(--c-accent); background: var(--c-accent-dim); }

/* ── RESPONSIVE ─────────────────────────────────────────── */
@media (max-width: 700px) {
  .sidebar { width: 100%; position: relative; height: auto; }
  .content { margin-left: 0; padding: 32px 24px; }
  .app { flex-direction: column; }
}

</style>
</head>
<body>

<div class="app">

  <!-- ═══════════════════════ SIDEBAR ═══════════════════════ -->
  <aside class="sidebar">

    <div class="sidebar-logo" onclick="navigate('home')" style="cursor:pointer;">
      <div class="logo-name">
        <div class="logo-icon"></div>
        <span><span class="bit">bit</span><span class="flip">flip</span></span>
      </div>
      <div class="logo-tagline">CTF Platform</div>
    </div>

    <div style="padding: 16px 24px; border-top: 1px solid var(--c-border); border-bottom: 1px solid var(--c-border); display: flex; gap: 8px;">
      <button class="lang-btn" id="lang-en" onclick="setLang('en')">EN</button>
      <button class="lang-btn" id="lang-fr" onclick="setLang('fr')">FR</button>
    </div>

    <nav class="sidebar-nav">
      <div class="nav-item" onclick="navigate('home')" id="nav-home">Home</div>
      <div class="nav-section-label" id="label-wargames" onclick="navigate('nmapwire')" style="cursor:pointer; transition: color 0.18s ease;" onmouseover="this.style.color='var(--c-text)'" onmouseout="this.style.color=''">Wargames</div>

      <div class="nav-item" id="nav-nmapwire" onclick="navigate('nmapwire')">
        <span id="label-nmapwire">NmapWire</span>
        <span class="nav-arrow" id="nav-arrow" onclick="event.stopPropagation(); toggleLevels()">›</span>
      </div>

      <div class="nav-levels" id="nav-levels">
        <!-- levels injected by JS -->
      </div>

      <div class="nav-item" id="nav-tcpdumpwire" onclick="navigate('tcpdumpwire')">
        <span id="label-tcpdumpwire">TcpdumpWire</span>
        <span class="nav-arrow" id="nav-tcpdump-arrow" onclick="event.stopPropagation(); toggleTcpdumpLevels()">›</span>
      </div>

      <div class="nav-levels" id="nav-tcpdump-levels">
        <!-- tcpdump levels injected by JS -->
      </div>

      <div class="nav-divider"></div>

      <div class="nav-item" onclick="navigate('rules')" id="nav-rules">Rules</div>
      <div class="nav-item" onclick="navigate('info')" id="nav-info">Info</div>
    </nav>

  </aside>

  <!-- ═══════════════════════ CONTENT ═══════════════════════ -->
  <main class="content" id="content"></main>

</div>

<script>

/* ── STATE ──────────────────────────────────────────────── */
let currentPage = 'home';
let currentGame = 'nmapwire';  /* 'nmapwire' or 'tcpdumpwire' */
let levelsOpen  = false;
let tcpdumpLevelsOpen = false;

function setLang(lang) {
  currentLang = lang;
  document.getElementById('lang-en').classList.toggle('active', lang === 'en');
  document.getElementById('lang-fr').classList.toggle('active', lang === 'fr');
  
  // update static sidebar labels
  document.getElementById('nav-home').textContent = i18n[lang].home;
  document.getElementById('label-wargames').textContent = i18n[lang].wargames;
  document.getElementById('nav-rules').textContent = i18n[lang].rules;
  document.getElementById('nav-info').textContent = i18n[lang].info;
  document.getElementById('label-nmapwire').textContent = 'NmapWire';
  document.getElementById('label-tcpdumpwire').textContent = i18n[lang].tcpdumpwire;

  buildSidebarLevels();
  renderPage(currentPage);
}

/* ── SIDEBAR LEVELS ─────────────────────────────────────── */
function buildSidebarLevels() {
  const lang = currentLang;

  // NmapWire levels
  const container = document.getElementById('nav-levels');
  container.innerHTML = levels.map(l => `
    <div class="nav-level-item ${l.tbd ? 'tbd-nav' : ''}"
         id="nav-level-${l.n}"
         onclick="navigateGameLevel('nmapwire', ${l.n})">
      <span class="nav-level-dot"></span>
      <span>${i18n[lang].level} ${l.n}${l.win ? ' → ' + i18n[lang].win : ''}</span>
    </div>
  `).join('');

  // TcpdumpWire levels
  const container2 = document.getElementById('nav-tcpdump-levels');
  container2.innerHTML = tcpdumpLevels.map(l => `
    <div class="nav-level-item"
         id="nav-tcpdump-level-${l.n}"
         onclick="navigateGameLevel('tcpdumpwire', ${l.n})">
      <span class="nav-level-dot"></span>
      <span>${i18n[lang].level} ${l.n}${l.win ? ' → ' + i18n[lang].win : ''}</span>
    </div>
  `).join('');

  document.querySelectorAll('.tbd-nav').forEach(el => {
    el.style.opacity = '0.35';
    el.style.pointerEvents = 'none';
  });
}

function toggleLevels() {
  levelsOpen = !levelsOpen;
  document.getElementById('nav-levels').classList.toggle('open', levelsOpen);
  document.getElementById('nav-arrow').style.transform = levelsOpen ? 'rotate(90deg)' : '';
  document.getElementById('nav-nmapwire').classList.toggle('active', levelsOpen);
}

function toggleTcpdumpLevels() {
  tcpdumpLevelsOpen = !tcpdumpLevelsOpen;
  document.getElementById('nav-tcpdump-levels').classList.toggle('open', tcpdumpLevelsOpen);
  document.getElementById('nav-tcpdump-arrow').style.transform = tcpdumpLevelsOpen ? 'rotate(90deg)' : '';
  document.getElementById('nav-tcpdumpwire').classList.toggle('active', tcpdumpLevelsOpen);
}

function navigateGameLevel(game, n) {
  currentGame = game;
  if (game === 'nmapwire') {
    if (!levelsOpen) toggleLevels();
    if (tcpdumpLevelsOpen) toggleTcpdumpLevels();
  } else {
    if (!tcpdumpLevelsOpen) toggleTcpdumpLevels();
    if (levelsOpen) toggleLevels();
  }
  navigate('level-' + n);
}

/* ── COPY COMMAND ────────────────────────────────────────── */
function copyCmd(btn, text) {
  navigator.clipboard.writeText(text).then(() => {
    btn.textContent = currentLang === 'en' ? 'copied!' : 'copié !';
    btn.classList.add('copied');
    setTimeout(() => {
      btn.textContent = currentLang === 'en' ? 'copy' : 'copier';
      btn.classList.remove('copied');
    }, 1800);
  });
}

/* ── COLLAPSIBLE TOGGLE ─────────────────────────────────── */
function toggleCollapsible(id) {
  const el = document.getElementById(id);
  if (!el) return;
  const body = el.querySelector('.collapsible-body');
  const toggleText = el.querySelector('.toggle-text');
  const isOpen = el.classList.contains('open');

  if (isOpen) {
    body.style.height = body.scrollHeight + 'px';
    requestAnimationFrame(() => {
      requestAnimationFrame(() => { body.style.height = '0'; });
    });
    el.classList.remove('open');
    if (toggleText) toggleText.textContent = i18n[currentLang].expand;
  } else {
    body.style.height = body.scrollHeight + 'px';
    el.classList.add('open');
    if (toggleText) toggleText.textContent = i18n[currentLang].collapse;
    body.addEventListener('transitionend', function onEnd() {
      body.style.height = 'auto';
      body.removeEventListener('transitionend', onEnd);
    });
  }
}

/* ── ROUTER ─────────────────────────────────────────────── */
function navigate(page) {
  currentPage = page;

  document.querySelectorAll('.nav-item, .nav-level-item').forEach(el => {
    el.classList.remove('active');
  });

  if (page === 'home') {
    document.getElementById('nav-home').classList.add('active');
  } else if (page === 'nmapwire') {
    document.getElementById('nav-nmapwire').classList.add('active');
    currentGame = 'nmapwire';
    if (!levelsOpen) toggleLevels();
    if (tcpdumpLevelsOpen) toggleTcpdumpLevels();
  } else if (page === 'tcpdumpwire') {
    document.getElementById('nav-tcpdumpwire').classList.add('active');
    currentGame = 'tcpdumpwire';
    if (!tcpdumpLevelsOpen) toggleTcpdumpLevels();
    if (levelsOpen) toggleLevels();
  } else if (page.startsWith('level-')) {
    const n = parseInt(page.split('-')[1]);
    if (currentGame === 'nmapwire') {
      const el = document.getElementById(`nav-level-${n}`);
      if (el) el.classList.add('active');
      if (!levelsOpen) toggleLevels();
      if (tcpdumpLevelsOpen) toggleTcpdumpLevels();
      document.getElementById('nav-nmapwire').classList.add('active');
    } else {
      const el = document.getElementById(`nav-tcpdump-level-${n}`);
      if (el) el.classList.add('active');
      if (!tcpdumpLevelsOpen) toggleTcpdumpLevels();
      if (levelsOpen) toggleLevels();
      document.getElementById('nav-tcpdumpwire').classList.add('active');
    }
  } else if (page === 'rules') {
    document.getElementById('nav-rules').classList.add('active');
  } else if (page === 'info') {
    document.getElementById('nav-info').classList.add('active');
  }

  renderPage(page);
}

/* ── RENDERERS ──────────────────────────────────────────── */
function renderPage(page) {
  const content = document.getElementById('content');
  let html = '';

  if (page === 'home')              html = renderHome();
  else if (page === 'nmapwire')     html = renderNmapwire();
  else if (page === 'tcpdumpwire')  html = renderTcpdumpwire();
  else if (page === 'rules')        html = renderRules();
  else if (page === 'info')         html = renderInfo();
  else if (page.startsWith('level-')) {
    const n = parseInt(page.split('-')[1]);
    html = renderLevel(n);
  }

  content.innerHTML = `<div class="page">${html}</div>`;
  window.scrollTo({ top: 0, behavior: 'instant' });
}

/* ── COLLAPSIBLE BUILDER ─────────────────────────────────── */
function buildCollapsible({ id, label, type, bodyHtml }) {
  const extraClass = type === 'hint' ? 'hint-collapsible' : 'info-collapsible';
  const toggleText = i18n[currentLang].expand;
  return `
    <div class="collapsible ${extraClass}" id="${id}">
      <div class="collapsible-header" onclick="toggleCollapsible('${id}')">
        <span class="collapsible-label">${label}</span>
        <span class="collapsible-toggle">
          <span class="toggle-text">${toggleText}</span>
          <span class="chevron">›</span>
        </span>
      </div>
      <div class="collapsible-body">
        <div class="collapsible-inner">
          ${bodyHtml}
        </div>
      </div>
    </div>
  `;
}

/* ── LEVEL PAGE ─────────────────────────────────────────── */
function renderLevel(n) {
  const lang = currentLang;
  const t = i18n[lang];
  const levs = currentGame === 'tcpdumpwire' ? tcpdumpLevels : levels;
  const level = levs.find(l => l.n === n);
  if (!level) return '<p>Level not found.</p>';

  const prev = levs.find(l => l.n === n - 1);
  const next = levs.find(l => l.n === n + 1);

  if (level.win) {
    const nextAfterWin = levels.find(l => l.n === n + 1);
    return `
      <div class="page-title">${t.level} ${n} → ${t.win}</div>
      <div class="page-subtitle">${level.concept[lang]}</div>

      <h2>${t.goal}</h2>
      ${level.goal[lang].split('\n\n').map(p => `<p>${p.trim()}</p>`).join('')}

      <div class="level-nav">
        <span class="level-nav-btn" onclick="navigate('level-${n-1}')">
          ← ${t.level} ${n-1}
        </span>
        <span style="font-size:11px; color:var(--c-muted)">${t.level} ${n}</span>
        <span class="level-nav-btn ${!nextAfterWin ? 'disabled' : ''}"
              onclick="nextAfterWin ? navigate('level-${n+1}') : null">
          ${nextAfterWin ? t.level + ' ' + (n+1) : t.next} →
        </span>
      </div>
    `;
  }

  /* ── format hint body ── */
  const hintBodyHtml = level.hint && level.hint[lang]
    ? level.hint[lang].split('\n').map(line => {
        line = line.trim();
        if (!line) return '';
        if (line.startsWith('nmap') || line.startsWith('sudo nmap') || line.startsWith('cat') || line.startsWith('tcpdump') || line.startsWith('sudo tcpdump') || line.startsWith('ping')) {
          const escaped = line.replace(/'/g, "\\'");
          const copyLabel = lang === 'en' ? 'copy' : 'copier';
          return `<div class="cmd-block"><span class="prompt">$</span> ${line}<button class="cmd-copy-btn" onclick="copyCmd(this,'${escaped}')">${copyLabel}</button></div>`;
        }
        return `<p>${line}</p>`;
      }).join('')
    : '';

  /* ── format info body ── */
  const infoBodyHtml = level.info && level.info[lang]
    ? level.info[lang].split('\n').map(line => {
        line = line.trim();
        if (!line) return '';
        if (line.startsWith('T') && lang === 'en') {
          return `<p style="padding-left:1em; color:var(--c-heading); font-size:12px;">${line}</p>`;
        }
        return `<p>${line}</p>`;
      }).join('')
    : '';

  const targetRow = level.target
    ? `<div class="info-row">
        <span class="info-label">${t.target} IP</span>
        <span class="info-value">${level.target}</span>
       </div>`
    : '';

  const hintSection = hintBodyHtml
    ? buildCollapsible({
        id: `collapsible-hint-${n}`,
        label: t.hint,
        type: 'hint',
        bodyHtml: hintBodyHtml
      })
    : '';

  const infoSection = infoBodyHtml
    ? buildCollapsible({
        id: `collapsible-info-${n}`,
        label: t.eduBackground,
        type: 'info',
        bodyHtml: infoBodyHtml
      })
    : '';

  const nextLabel = next && next.win ? t.win : `${t.level} ${n+1}`;

  return `
    <div class="page-title">${t.level} ${n} → ${nextLabel}</div>
    <div class="page-subtitle">${level.concept[lang]}</div>

    <h2>${t.goal}</h2>
    ${level.goal[lang].split('\n\n').map(p => `<p>${p.trim()}</p>`).join('')}

    <h2>${t.connectionInfo}</h2>
    <div class="info-box">
      <div class="info-box-title">${t.sshInto}</div>
      <div class="info-row">
        <span class="info-label">${t.host}</span>
        <span class="info-value accent">${HOST}</span>
      </div>
      <div class="info-row">
        <span class="info-label">${t.port}</span>
        <span class="info-value">${PORT}</span>
      </div>
      <div class="info-row">
        <span class="info-label">${t.user}</span>
        <span class="info-value">${userPrefix}${n}</span>
      </div>
      ${targetRow}
    </div>

    <div class="cmd-block"><span class="prompt">$</span> ssh ${userPrefix}${n}@${HOST} -p ${PORT}<button class="cmd-copy-btn" onclick="copyCmd(this,'ssh ${userPrefix}${n}@${HOST} -p ${PORT}')">${lang === 'en' ? 'copy' : 'copier'}</button></div>

    ${hintSection}
    ${infoSection}

    <div class="level-nav">
      <span class="level-nav-btn ${n === 0 ? 'disabled' : ''}"
            onclick="navigate('level-${n-1}')">
        ← ${t.level} ${n-1}
      </span>
      <span style="font-size:11px; color:var(--c-muted)">${t.level} ${n}</span>
      <span class="level-nav-btn ${!next ? 'disabled' : ''}"
            onclick="navigate('level-${n+1}')">
        ${nextLabel} →
      </span>
    </div>
  `;
}

// Fix copy button on commands with && (use first part)
document.addEventListener('click', function(e) {
  const btn = e.target.closest('.cmd-copy-btn');
  if (!btn) return;
  const block = btn.closest('.cmd-block');
  if (!block) return;
  const text = block.textContent.replace('copy', '').replace('copier', '').replace('copied!', '').replace('copié !', '').trim();
  if (text.includes('&&')) {
    e.preventDefault();
    navigator.clipboard.writeText(text);
  }
});
